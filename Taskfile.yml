version: "3"

# Single source of tasks invoked identically by humans, AI agents, and CI.
# Keeps tooling and versions consistent across contexts.

env:
  DISABLE_MKDOCS_2_WARNING: "true"

vars:
  VENV: .venv
  PY: "{{.VENV}}/bin/python"
  PIP: "{{.VENV}}/bin/pip"
  MKDOCS: "{{.VENV}}/bin/mkdocs"
  CF_PAGES_PROJECT: linear-work-management

tasks:
  setup:
    desc: Create the virtualenv and install docs tooling.
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.PIP}} install -U pip"
      - "{{.PIP}} install -r requirements.txt"
    status:
      - test -x {{.MKDOCS}}

  skills:index:
    desc: Regenerate docs/skills/index.md from skills/*/SKILL.md (single source).
    cmds:
      - "{{.PY}} scripts/gen_skill_index.py"

  diagrams:
    desc: Render docs/diagrams/*.d2 to committed SVGs with d2 (offline; no Kroki service).
    cmds:
      - |
        command -v d2 >/dev/null || { echo "d2 not found — install it: brew install d2 (or see https://d2lang.com/tour/install)"; exit 1; }
        for f in docs/diagrams/*.d2; do d2 --theme=0 "$f" "${f%.d2}.svg"; done
      - "{{.PY}} scripts/check_diagrams.py"

  diagrams:check:
    desc: Verify every D2 source has a committed SVG (no d2 needed).
    cmds:
      - "{{.PY}} scripts/check_diagrams.py"

  serve:
    desc: Live-preview the docs site locally.
    deps: [setup, skills:index, diagrams:check]
    cmds:
      - "{{.MKDOCS}} serve"

  build:
    desc: Build the static site into ./site (fails on warnings).
    deps: [setup, skills:index, diagrams:check]
    cmds:
      - "{{.MKDOCS}} build --strict"

  deploy:
    desc: Deploy ./site to Cloudflare Pages (needs wrangler + CF creds).
    deps: [build]
    cmds:
      - npx wrangler pages deploy site --project-name={{.CF_PAGES_PROJECT}}

  doctor:
    desc: Audit the Linear workspace against the documented rules (see GRI-77).
    cmds:
      - "{{.PY}} scripts/linear_doctor.py"

  lint:prose:
    desc: Flag AI-generated-text tells in the guide prose (see STYLE.md).
    cmds:
      - "{{.PY}} scripts/prose_lint.py"

  deck:
    desc: Emit a Marp stakeholder deck from live Linear state (see GRI-81).
    cmds:
      - "{{.PY}} scripts/linear_deck.py"

  linear:skills:
    desc: 'Publish opted-in skills (linear_skill: true) to Linear as team-shared Agent Skills. Flags: --dry-run, --check.'
    cmds:
      - "{{.PY}} scripts/linear_skills_sync.py {{.CLI_ARGS}}"
