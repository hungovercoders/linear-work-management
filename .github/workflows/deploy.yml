name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  # Builds and checks on every PR and push. The job keeps its old name so any
  # required status check called "build-deploy" still reports.
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Regenerate skill index
        run: python scripts/gen_skill_index.py

      - name: Check diagrams (every D2 source has a committed SVG)
        run: python scripts/check_diagrams.py

      - name: Lint prose (AI-tell gate)
        run: python scripts/prose_lint.py

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload the site for GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes to GitHub Pages from main only. Requires Pages enabled with
  # "GitHub Actions" as the source (repo Settings -> Pages). No secrets needed.
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
