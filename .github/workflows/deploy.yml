name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write

env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Job-level env so the deploy step's `if` can see whether the secret is set
    # (secrets can't be referenced directly in an `if` expression).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Regenerate skill index
        run: python scripts/gen_skill_index.py

      - name: Check diagrams (every D2 source has a committed SVG)
        run: python scripts/check_diagrams.py

      - name: Lint prose (AI-tell gate)
        run: python scripts/prose_lint.py

      - name: Build site (strict)
        run: mkdocs build --strict

      # Deploys production on main and a preview on PRs.
      # Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
      # and a Cloudflare Pages project named "linear-work-management".
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=linear-work-management --branch=${{ github.head_ref || github.ref_name }}
