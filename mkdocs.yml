site_name: Linear Ways of Working
site_description: The single source of truth for how we use Linear — guidelines, expectations and the AI skills that go with them.
site_url: https://hungovercoders.github.io/linear-work-management/
repo_url: https://github.com/hungovercoders/linear-work-management
repo_name: linear-work-management
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/sitemap
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.tabs
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Start here:
      - index.md
      - The five rules: hard-rules.md
      - Worked example: examples.md
  - Guides:
      - Initiatives: initiatives.md
      - Projects: projects.md
      - Issues:
          - issues/index.md
          - Project work: issues/project-work.md
          - Triage and BAU: issues/triage.md
      - Teams: how-teams-work.md
  - Staying on track:
      - Updates: communications.md
      - Dashboards: dashboards.md
      - Flow: flow.md
  - Reference:
      - States and labels: teams.md
      - Integrations: integrations.md
      - Setup checklist: setup.md
      - Skills: skills/index.md
      - Glossary: glossary.md
